version: '3.8'

services:
  webapi:
    container_name: ambev_developer_evaluation_webapi
    build:
      context: .
      dockerfile: src/Ambev.DeveloperEvaluation.WebApi/Dockerfile
    depends_on:
      - postgres
      - mongo
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080      
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=developer_evaluation;Username=developer;Password=ev@luAt10n
      - Jwt__SecretKey=YourSuperSecretKeyForJwtTokenGenerationThatShouldBeAtLeast32BytesLong
      - Redis__Host=redis
      - Redis__Password=ev@luAt10n
      - Mongo__ConnectionString=mongodb://developer:ev@luAt10n@mongo:27017

    ports:
      - "8080:8080"

  postgres:
    container_name: ambev_postgres
    image: postgres:13
    environment:
      POSTGRES_DB: developer_evaluation
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: ev@luAt10n
    ports:
      - "5432:5432"

  mongo:
    container_name: ambev_mongo
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: developer
      MONGO_INITDB_ROOT_PASSWORD: ev@luAt10n
    ports:
      - "27017:27017"

  redis:
    container_name: ambev_redis
    image: redis:7-alpine
    command: redis-server --requirepass ev@luAt10n
    ports:
      - "6379:6379"